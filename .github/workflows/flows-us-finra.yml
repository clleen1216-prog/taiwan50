name: flows-us-finra
# FINRA 每日空單量：每天補抓前一個交易日（也會補任何缺漏的日子）。
on:
  schedule:
    - cron: "0 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        working-directory: code
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          YEARS: "3"
          OUT_DIR: ${{ github.workspace }}/out/data
        run: npx -y tsx@4.19.2 --tsconfig tsconfig.json scripts/flows-us.ts finra
      - name: Commit data
        if: always()
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "flows-us-finra $(date -u +%F)"
          git pull --rebase origin data
          git push origin HEAD:data
