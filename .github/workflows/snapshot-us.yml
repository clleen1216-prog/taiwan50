name: snapshot-us
# UTC 22:00 週一到週五（美股收盤後，夏令與冬令都已完成日線）
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run snapshot
        working-directory: code
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SCAN_WAIT_MS: "120000"
          OUT_DIR: ${{ github.workspace }}/out/data
        run: npx -y tsx@4.19.2 --tsconfig tsconfig.json scripts/snapshot.ts us
      - name: Commit data
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "us snapshot $(date -u +%F)"
          git pull --rebase origin data
          git push origin HEAD:data
